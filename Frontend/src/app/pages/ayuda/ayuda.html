<div class="ayuda-container">
  <div class="card shadow-sm border-0">
    <div class="card-header header-ayuda text-white d-flex align-items-center">
      <i class="bi bi-question-circle-fill me-2"></i>
      <h5 class="mb-0">Centro de Ayuda</h5>
    </div>

    <div class="card-body">
      <!-- Guía rápida -->
      <h6 class="fw-bold text-dark mb-3">
        <i class="bi bi-book me-1"></i>Guía Rápida
      </h6>

      <div class="accordion mb-4" id="guiaAccordion">
        <div *ngFor="let paso of guia; let i = index" class="accordion-item border-0 mb-2">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              [class.collapsed]="guiaAbierto !== i"
              type="button"
              (click)="toggleGuia(i)"
            >
              <i class="me-2" [ngClass]="paso.icono" [style.color]="paso.color"></i>
              {{ paso.titulo }}
            </button>
          </h2>
          <div class="accordion-collapse" [class.show]="guiaAbierto === i" [class.collapse]="guiaAbierto !== i">
            <div class="accordion-body">
              <ol class="guia-pasos mb-0">
                <li *ngFor="let p of paso.pasos">{{ p }}</li>
              </ol>
            </div>
          </div>
        </div>
      </div>

      <!-- Preguntas frecuentes -->
      <h6 class="fw-bold text-dark mb-3">
        <i class="bi bi-chat-dots me-1"></i>Preguntas Frecuentes
      </h6>

      <div class="accordion" id="faqAccordion">
        <div *ngFor="let item of faq; let i = index" class="accordion-item border-0 mb-2">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              [class.collapsed]="faqAbierto !== i"
              type="button"
              (click)="toggleFaq(i)"
            >
              <i class="me-2" [ngClass]="item.icono" [style.color]="item.color"></i>
              {{ item.pregunta }}
            </button>
          </h2>
          <div class="accordion-collapse" [class.show]="faqAbierto === i" [class.collapse]="faqAbierto !== i">
            <div class="accordion-body text-muted">
              {{ item.respuesta }}
            </div>
          </div>
        </div>
      </div>

      <!-- Contacto -->
      <div class="mt-4 p-3 bg-light rounded-3 text-center">
        <i class="bi bi-headset text-primary" style="font-size: 1.5rem"></i>
        <h6 class="fw-bold mt-2 mb-1">¿Necesitás más ayuda?</h6>
        <ul class="list-unstyled mb-0 small text-muted">
          <li><i class="bi bi-envelope-fill me-1"></i>contacto@citamedica.co</li>
          <li><i class="bi bi-telephone-fill me-1"></i>+57 300 123 4567</li>
          <li><i class="bi bi-geo-alt-fill me-1"></i>Medellín, Colombia</li>
          <li><i class="bi bi-clock-fill me-1"></i>Lun - Vie: 8:00 AM - 6:00 PM</li>
        </ul>
      </div>
    </div>
  </div>
</div>
