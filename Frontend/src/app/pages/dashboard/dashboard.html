<!-- Barra de navegación superior -->

  <a class="navbar-brand fw-bold" routerLink="/dashboard/inicio">Sistema de Citas</a>

  <div class="navbar-nav me-auto">
    <a class="nav-link" routerLink="/dashboard/inicio" routerLinkActive="active">Inicio</a>
    <a class="nav-link" routerLink="/dashboard/pacientes" routerLinkActive="active">Pacientes</a>
    <a class="nav-link" routerLink="/dashboard/medicos" routerLinkActive="active">Médicos</a>
    <a class="nav-link" routerLink="/dashboard/citas" routerLinkActive="active">Citas</a>
    <a class="nav-link" routerLink="/dashboard/usuarios" routerLinkActive="active">Usuarios</a>
  </div>

  <!-- Grupo derecho: Nombre, Rol y Botón de salir -->
  <div class="d-flex align-items-center gap-3">
    <!-- Perfil de usuario con el saludo original -->
    <div class="user-info-container text-end">
      <span class="user-name"
        >Hola, <strong>{{ nombreUsuario }}</strong></span
      >
      <span class="user-role">{{ rolUsuario }}</span>
    </div>

    <button class="btn btn-light btn-sm fw-semibold" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
