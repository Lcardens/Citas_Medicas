<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>MÃ©dicos</h2>

    <button *ngIf="esPersonalMedico" class="btn btn-primary" (click)="abrirModal()">
      + Nuevo MÃ©dico
    </button>
  </div>

  <div *ngIf="cargando" class="d-flex justify-content-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!cargando" class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Registro MÃ©dico</th>
          <th>Nombre Completo</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let medico of medicos; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ medico.Registromedico }}</td>
          <td>{{ medico.Nombre }}</td>
          <td class="text-center">
            <button
              class="btn btn-outline-danger btn-sm"
              title="Eliminar mÃ©dico y sus datos"
              (click)="eliminarMedico(medico._id, medico.Nombre)"
            >
              <i class="bi bi-trash me-1"></i>Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div
  *ngIf="mostrarModal && esPersonalMedico"
  class="modal fade show d-block"
  tabindex="-1"
  style="background-color: rgba(0, 0, 0, 0.5)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Registrar MÃ©dico</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>
      <form (ngSubmit)="guardarMedico()">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Registro MÃ©dico</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="nuevoMedico.Registromedico"
              name="Registromedico"
              required
              placeholder="Ej. 123456"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="nuevoMedico.Nombre"
              name="Nombre"
              required
              placeholder="Ej. Luisa"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
