<div class="container py-2">
  <!-- Encabezado con Botón -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary mb-0">Gestión de Usuarios</h2>
    <button class="btn btn-primary rounded-pill px-4" (click)="abrirModal()">
      + Crear Usuario
    </button>
  </div>

  <!-- Tabla de Usuarios -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let usuario of usuarios">
            <td class="fw-semibold">{{ usuario.nombre || usuario.Nombre }}</td>
            <td>{{ usuario.email }}</td>
            <td>
              <span
                class="badge rounded-pill"
                [ngClass]="{
                  'bg-primary':
                    usuario.rol?.toLowerCase() === 'admin' ||
                    usuario.rol?.toLowerCase() === 'administrador',
                  'bg-success': usuario.rol?.toLowerCase() === 'medico',
                  'bg-secondary':
                    usuario.rol?.toLowerCase() === 'paciente' ||
                    usuario.rol?.toLowerCase() === 'usuario',
                }"
              >
                {{ usuario.rol }}
              </span>
            </td>
          </tr>
          <tr *ngIf="usuarios.length === 0">
            <td colspan="3" class="text-center py-4 text-muted">No hay usuarios registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal para Crear Usuario -->
<div
  *ngIf="mostrarModalCrear"
  class="modal fade show d-block"
  tabindex="-1"
  style="background-color: rgba(0, 0, 0, 0.5)"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold">Registrar Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" (click)="cerrarModal()"></button>
      </div>

      <form (ngSubmit)="crearUsuario()">
        <div class="modal-body p-4">
          <!-- 🔴 ALERTA DE ERROR VISIBLE SOLO SI HAY ERROR -->
          <div
            *ngIf="mensajeError"
            class="alert alert-danger py-2 px-3 mb-3 text-center small"
            role="alert"
          >
            {{ mensajeError }}
          </div>

          <!-- Nombre -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre Completo</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="nuevoUsuario.nombre"
              name="nombre"
              placeholder="Ej: Juan Pérez"
              required
            />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Correo Electrónico</label>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="nuevoUsuario.email"
              name="email"
              placeholder="correo@ejemplo.com"
              required
            />
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input
              type="password"
              class="form-control"
              [(ngModel)]="nuevoUsuario.password"
              name="password"
              placeholder="******"
              required
            />
          </div>

          <!-- Rol -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Rol del Usuario</label>
            <select class="form-select" [(ngModel)]="nuevoUsuario.rol" name="rol" required>
              <option value="paciente">Paciente</option>
              <option value="medico">Médico</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>

        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-outline-secondary" (click)="cerrarModal()">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary px-4">Guardar Usuario</button>
        </div>
      </form>
    </div>
  </div>
</div>
